name: firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "esp32-lcd/**"
      - "patches/**"
      - "tools/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp32s3:
    name: pico-fido (ESP32-S3, 4MB, LCD)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    container:
      image: espressif/idf:v5.5.1
    env:
      # Personal/dev build. Change these to your own VID/PID before
      # redistributing binaries (see README, "VID/PID").
      FIDO_USB_VID: "0x2E8A"
      FIDO_USB_PID: "0x10FE"
      # Revisions verified by the upstream project (README, 2026-10-23).
      PICO_FIDO_REV: ade770281dd4fd8c627add34ed078f56ec40a07b
      PICO_KEYS_SDK_REV: a2f0a51588fb523f2d6614e008b4bdbb45e443f1
    steps:
      - uses: actions/checkout@v4

      - name: Install patch helpers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends patch perl

      - name: Fetch pico-fido (pinned)
        run: |
          git clone https://github.com/polhenarejos/pico-fido.git vendor/pico-fido
          git -C vendor/pico-fido checkout "$PICO_FIDO_REV"
          git -C vendor/pico-fido submodule update --init --recursive
          git -C vendor/pico-fido/pico-keys-sdk checkout "$PICO_KEYS_SDK_REV"

      - name: Build
        shell: bash
        run: |
          # GitHub does not run the image entrypoint, so export the toolchain.
          . "$IDF_PATH/export.sh"
          # ESP-IDF v5.5 ships esptool 4.x (underscore subcommands) while the
          # project scripts use the esptool 5.x spelling (merge-bin).
          cat > /usr/local/bin/esptool <<'EOF'
          #!/usr/bin/env bash
          args=()
          for a in "$@"; do
            case "$a" in
              merge-bin|write-flash|read-flash|erase-flash|erase-region|read-mac|flash-id|chip-id|write-flash-status|read-flash-status)
                a="${a//-/_}" ;;
            esac
            args+=("$a")
          done
          exec esptool.py "${args[@]}"
          EOF
          chmod +x /usr/local/bin/esptool
          sh tools/build-pico-fido-esp32s3.sh

      - name: Write build info
        run: |
          cd build/pico-fido-esp32s3
          sha256sum pico_fido_full.bin | tee pico_fido_full.bin.sha256
          {
            echo "pico-fido: $PICO_FIDO_REV"
            echo "pico-keys-sdk: $PICO_KEYS_SDK_REV"
            echo "esp-idf: v5.5.1"
            echo "usb: $FIDO_USB_VID:$FIDO_USB_PID"
            echo "size: $(stat -c%s pico_fido_full.bin) bytes"
          } > build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pico_fido_full-esp32s3
          path: |
            build/pico-fido-esp32s3/pico_fido_full.bin
            build/pico-fido-esp32s3/pico_fido_full.bin.sha256
            build/pico-fido-esp32s3/build-info.txt
          if-no-files-found: error
          retention-days: 30
